.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  ) {

  }

  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;

  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

        &lt;div class=&quot;cfc-step&quot; id=&quot;cfc-step-time&quot;&gt;&lt;span class=&quot;cfc-step-circle&quot;&gt;2&lt;/span&gt;&lt;span&gt;Horário&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;cfc-step&quot; id=&quot;cfc-step-data&quot;&gt;&lt;span class=&quot;cfc-step-circle&quot;&gt;3&lt;/span&gt;&lt;span&gt;Seus dados&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;main class=&quot;cfc-main&quot;&gt;
      &lt;div id=&quot;cfc-scheduler-panel&quot;&gt;
        &lt;div class=&quot;cfc-heading&quot;&gt;&lt;span class=&quot;cfc-number&quot;&gt;1&lt;/span&gt;&lt;div&gt;&lt;h2&gt;Escolha uma data&lt;/h2&gt;&lt;p&gt;Os dias com ponto verde possuem aulas disponíveis.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;cfc-booking-grid&quot;&gt;
          &lt;section class=&quot;cfc-calendar&quot; aria-label=&quot;Calendário de aulas&quot;&gt;
            &lt;div class=&quot;cfc-month-bar&quot;&gt;&lt;h3 class=&quot;cfc-month-title&quot; id=&quot;cfc-month-title&quot;&gt;&lt;/h3&gt;&lt;div class=&quot;cfc-month-actions&quot;&gt;&lt;button class=&quot;cfc-month-button&quot; id=&quot;cfc-prev&quot; type=&quot;button&quot; aria-label=&quot;Mês anterior&quot;&gt;‹&lt;/button&gt;&lt;button class=&quot;cfc-month-button&quot; id=&quot;cfc-next&quot; type=&quot;button&quot; aria-label=&quot;Próximo mês&quot;&gt;›&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
            &lt;div class=&quot;cfc-weekdays&quot; aria-hidden=&quot;true&quot;&gt;&lt;span class=&quot;cfc-weekday&quot;&gt;Dom&lt;/span&gt;&lt;span class=&quot;cfc-weekday&quot;&gt;Seg&lt;/span&gt;&lt;span class=&quot;cfc-weekday&quot;&gt;Ter&lt;/span&gt;&lt;span class=&quot;cfc-weekday&quot;&gt;Qua&lt;/span&gt;&lt;span class=&quot;cfc-weekday&quot;&gt;Qui&lt;/span&gt;&lt;span class=&quot;cfc-weekday&quot;&gt;Sex&lt;/span&gt;&lt;span class=&quot;cfc-weekday&quot;&gt;Sáb&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;cfc-calendar-grid&quot; id=&quot;cfc-calendar-grid&quot;&gt;&lt;/div&gt;
            &lt;div class=&quot;cfc-calendar-footer&quot;&gt;&lt;span class=&quot;cfc-legend&quot;&gt;&lt;span class=&quot;cfc-legend-dot&quot;&gt;&lt;/span&gt; Data com aula&lt;/span&gt;&lt;span&gt;Agenda aberta até novembro&lt;/span&gt;&lt;/div&gt;
          &lt;/section&gt;

          &lt;section class=&quot;cfc-times-panel&quot; id=&quot;cfc-times-panel&quot; aria-label=&quot;Horários disponíveis&quot; aria-live=&quot;polite&quot;&gt;
            &lt;div class=&quot;cfc-empty&quot; id=&quot;cfc-empty&quot;&gt;&lt;div&gt;&lt;div class=&quot;cfc-empty-icon&quot;&gt;31&lt;/div&gt;&lt;strong&gt;Selecione uma data&lt;/strong&gt;&lt;span&gt;Ao clicar em um dia marcado, os horários aparecem aqui.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
            &lt;div id=&quot;cfc-times-content&quot; hidden&gt;&lt;div class=&quot;cfc-times-head&quot;&gt;&lt;span class=&quot;cfc-times-kicker&quot;&gt;2. Escolha o horário&lt;/span&gt;&lt;h3 id=&quot;cfc-selected-date&quot;&gt;&lt;/h3&gt;&lt;p&gt;Horários de início e término da aula&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;cfc-time-list&quot; id=&quot;cfc-time-list&quot;&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;/section&gt;
        &lt;/div&gt;
        &lt;div class=&quot;cfc-choice&quot;&gt;&lt;div&gt;&lt;small&gt;Sua escolha&lt;/small&gt;&lt;strong id=&quot;cfc-choice-text&quot; aria-live=&quot;polite&quot;&gt;Escolha uma data e um horário&lt;/strong&gt;&lt;/div&gt;&lt;button class=&quot;cfc-primary&quot; id=&quot;cfc-continue&quot; type=&quot;button&quot; disabled&gt;Continuar&lt;/button&gt;&lt;/div&gt;

      &lt;section class=&quot;cfc-contact&quot; id=&quot;cfc-contact-panel&quot; hidden&gt;
        &lt;h2&gt;3. Confirme seus dados&lt;/h2&gt;&lt;p class=&quot;cfc-contact-copy&quot;&gt;Usamos essas informações para identificar e confirmar sua reserva.&lt;/p&gt;
        &lt;div class=&quot;cfc-summary&quot;&gt;&lt;span class=&quot;cfc-summary-mark&quot;&gt;✓&lt;/span&gt;&lt;span id=&quot;cfc-summary-text&quot;&gt;&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;cfc-fields&quot;&gt;
          &lt;label class=&quot;cfc-field&quot;&gt;&lt;span&gt;Nome completo&lt;/span&gt;&lt;input id=&quot;cfc-name&quot; type=&quot;text&quot; placeholder=&quot;Seu nome&quot; /&gt;&lt;/label&gt;
          &lt;label class=&quot;cfc-field&quot;&gt;&lt;span&gt;WhatsApp com DDD&lt;/span&gt;&lt;input id=&quot;cfc-phone&quot; type=&quot;tel&quot; inputmode=&quot;numeric&quot; placeholder=&quot;16999998888&quot; /&gt;&lt;/label&gt;
          &lt;label class=&quot;cfc-field&quot;&gt;&lt;span&gt;E-mail&lt;/span&gt;&lt;input id=&quot;cfc-email&quot; type=&quot;email&quot; placeholder=&quot;voce@email.com&quot; /&gt;&lt;/label&gt;
        &lt;/div&gt;
        &lt;div class=&quot;cfc-actions&quot;&gt;&lt;button class=&quot;cfc-secondary&quot; id=&quot;cfc-back&quot; type=&quot;button&quot;&gt;Voltar ao calendário&lt;/button&gt;&lt;button class=&quot;cfc-primary&quot; id=&quot;cfc-confirm&quot; type=&quot;button&quot; disabled&gt;Confirmar minha aula&lt;/button&gt;&lt;/div&gt;
      &lt;/section&gt;

      &lt;section class=&quot;cfc-success&quot; id=&quot;cfc-success-panel&quot; hidden aria-live=&quot;polite&quot;&gt;&lt;div&gt;&lt;div class=&quot;cfc-check&quot;&gt;✓&lt;/div&gt;&lt;h2&gt;Aula reservada!&lt;/h2&gt;&lt;p id=&quot;cfc-success-text&quot;&gt;&lt;/p&gt;&lt;button class=&quot;cfc-secondary&quot; id=&quot;cfc-again&quot; type=&quot;button&quot; style=&quot;margin-top:18px&quot;&gt;Agendar outra aula&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;
    &lt;/main&gt;
  &lt;/section&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;carefit-calendar-booking&#x27;);
      const calendarGrid = root.querySelector(&#x27;#cfc-calendar-grid&#x27;);
      const monthTitle = root.querySelector(&#x27;#cfc-month-title&#x27;);
      const prevButton = root.querySelector(&#x27;#cfc-prev&#x27;);
      const nextButton = root.querySelector(&#x27;#cfc-next&#x27;);
      const emptyState = root.querySelector(&#x27;#cfc-empty&#x27;);
      const timesContent = root.querySelector(&#x27;#cfc-times-content&#x27;);
      const timeList = root.querySelector(&#x27;#cfc-time-list&#x27;);
      const selectedDateTitle = root.querySelector(&#x27;#cfc-selected-date&#x27;);
      const choiceText = root.querySelector(&#x27;#cfc-choice-text&#x27;);
      const continueButton = root.querySelector(&#x27;#cfc-continue&#x27;);
      const schedulerPanel = root.querySelector(&#x27;#cfc-scheduler-panel&#x27;);
      const contactPanel = root.querySelector(&#x27;#cfc-contact-panel&#x27;);
      const successPanel = root.querySelector(&#x27;#cfc-success-panel&#x27;);
      const minDate = new Date(2026, 8, 7);
      const maxDate = new Date(2026, 10, 30);
      const months = [&#x27;janeiro&#x27;, &#x27;fevereiro&#x27;, &#x27;março&#x27;, &#x27;abril&#x27;, &#x27;maio&#x27;, &#x27;junho&#x27;, &#x27;julho&#x27;, &#x27;agosto&#x27;, &#x27;setembro&#x27;, &#x27;outubro&#x27;, &#x27;novembro&#x27;, &#x27;dezembro&#x27;];
      const weekdays = [&#x27;domingo&#x27;, &#x27;segunda-feira&#x27;, &#x27;terça-feira&#x27;, &#x27;quarta-feira&#x27;, &#x27;quinta-feira&#x27;, &#x27;sexta-feira&#x27;, &#x27;sábado&#x27;];
      const times = [{start:&#x27;06:00&#x27;, end:&#x27;07:00&#x27;}, {start:&#x27;07:00&#x27;, end:&#x27;08:00&#x27;}, {start:&#x27;08:00&#x27;, end:&#x27;09:00&#x27;}];
      let viewDate = new Date(2026, 8, 1);
      let selectedDate = null;
      let selectedTime = null;

      function sameDay(a, b) { return a &amp;&amp; b &amp;&amp; a.getFullYear() === b.getFullYear() &amp;&amp; a.getMonth() === b.getMonth() &amp;&amp; a.getDate() === b.getDate(); }
      function isClassDay(date) { const day = date.getDay(); return date &gt;= minDate &amp;&amp; date &lt;= maxDate &amp;&amp; (day === 1 || day === 3 || day === 5); }
      function fullDate(date) { return `${weekdays[date.getDay()]}, ${date.getDate()} de ${months[date.getMonth()]}`; }
      function sentenceCase(text) { return text.charAt(0).toUpperCase() + text.slice(1); }
      function titleDate(date) { return sentenceCase(`${weekdays[date.getDay()]}, ${date.getDate()} de ${months[date.getMonth()]}`); }
      function vacancy(date, index) { const value = (date.getDate() + date.getMonth() * 3 + index * 5) % 11; return value === 0 ? 0 : value &lt; 3 ? 1 : value &lt; 6 ? 2 : 3; }
      function selectionText() { if (!selectedDate || selectedTime === null) return &#x27;Escolha uma data e um horário&#x27;; const time = times[selectedTime]; return `${fullDate(selectedDate)} · ${time.start} às ${time.end}`; }

      function renderCalendar() {
        monthTitle.textContent = sentenceCase(`${months[viewDate.getMonth()]} de ${viewDate.getFullYear()}`);
        calendarGrid.innerHTML = &#x27;&#x27;;
        const firstDay = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1);
        const daysInMonth = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 0).getDate();
        for (let index = 0; index &lt; firstDay.getDay(); index += 1) {
          const empty = document.createElement(&#x27;span&#x27;); empty.className = &#x27;cfc-day-empty&#x27;; empty.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;); calendarGrid.appendChild(empty);
        }
        for (let day = 1; day &lt;= daysInMonth; day += 1) {
          const date = new Date(viewDate.getFullYear(), viewDate.getMonth(), day);
          const available = isClassDay(date);
          const button = document.createElement(&#x27;button&#x27;);
          button.type = &#x27;button&#x27;;
          button.className = `cfc-date${available ? &#x27; is-available&#x27; : &#x27;&#x27;}`;
          button.textContent = String(day);
          button.disabled = !available;
          button.setAttribute(&#x27;aria-pressed&#x27;, String(sameDay(date, selectedDate)));
          button.setAttribute(&#x27;aria-label&#x27;, available ? `${fullDate(date)}, possui aulas` : `${fullDate(date)}, sem aulas disponíveis`);
          if (available) button.addEventListener(&#x27;click&#x27;, () =&gt; {
            selectedDate = date;
            selectedTime = null;
            renderCalendar();
            renderTimes();
            updateProgress();
            if (window.innerWidth &lt;= 700) {
              const reduceMotion = window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
              requestAnimationFrame(() =&gt; root.querySelector(&#x27;#cfc-times-panel&#x27;).scrollIntoView({behavior: reduceMotion ? &#x27;auto&#x27; : &#x27;smooth&#x27;, block: &#x27;start&#x27;}));
            }
          });
          calendarGrid.appendChild(button);
        }
        prevButton.disabled = viewDate.getFullYear() === minDate.getFullYear() &amp;&amp; viewDate.getMonth() === minDate.getMonth();
        nextButton.disabled = viewDate.getFullYear() === maxDate.getFullYear() &amp;&amp; viewDate.getMonth() === maxDate.getMonth();
      }

      function renderTimes() {
        if (!selectedDate) { emptyState.hidden = false; timesContent.hidden = true; updateChoice(); return; }
        emptyState.hidden = true;
        timesContent.hidden = false;
        selectedDateTitle.textContent = titleDate(selectedDate);
        timeList.innerHTML = &#x27;&#x27;;
        times.forEach((time, index) =&gt; {
          const vacancies = vacancy(selectedDate, index);
          const button = document.createElement(&#x27;button&#x27;);
          button.type = &#x27;button&#x27;;
          button.className = &#x27;cfc-time&#x27;;
          button.disabled = vacancies === 0;
          button.setAttribute(&#x27;aria-pressed&#x27;, String(index === selectedTime));
          button.setAttribute(&#x27;aria-label&#x27;, `${time.start} às ${time.end}, ${vacancies === 0 ? &#x27;turma lotada&#x27; : vacancies + &#x27; vagas&#x27;}`);
          const statusClass = vacancies === 1 ? &#x27; is-low&#x27; : &#x27;&#x27;;
          const status = vacancies === 0 ? &#x27;Lotada&#x27; : vacancies === 1 ? &#x27;Última vaga&#x27; : `${vacancies} vagas`;
          button.innerHTML = `&lt;span&gt;&lt;span class=&quot;cfc-time-range&quot;&gt;${time.start} → ${time.end}&lt;/span&gt;&lt;span class=&quot;cfc-time-caption&quot;&gt;1 hora de aula&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;cfc-vacancy${statusClass}&quot;&gt;${status}&lt;/span&gt;`;
          if (vacancies &gt; 0) button.addEventListener(&#x27;click&#x27;, () =&gt; { selectedTime = index; renderTimes(); updateProgress(); });
          timeList.appendChild(button);
        });
        updateChoice();
      }

      function updateChoice() { choiceText.textContent = selectionText(); continueButton.disabled = !selectedDate || selectedTime === null; }

      function updateProgress(stage = &#x27;schedule&#x27;) {
        const dateStep = root.querySelector(&#x27;#cfc-step-date&#x27;);
        const timeStep = root.querySelector(&#x27;#cfc-step-time&#x27;);
        const dataStep = root.querySelector(&#x27;#cfc-step-data&#x27;);
        dateStep.className = selectedDate ? &#x27;cfc-step is-done&#x27; : &#x27;cfc-step is-active&#x27;;
        timeStep.className = stage === &#x27;schedule&#x27; ? (selectedDate ? &#x27;cfc-step is-active&#x27; : &#x27;cfc-step&#x27;) : &#x27;cfc-step is-done&#x27;;
        dataStep.className = stage === &#x27;contact&#x27; ? &#x27;cfc-step is-active&#x27; : stage === &#x27;success&#x27; ? &#x27;cfc-step is-done&#x27; : &#x27;cfc-step&#x27;;
        dateStep.querySelector(&#x27;.cfc-step-circle&#x27;).textContent = selectedDate ? &#x27;✓&#x27; : &#x27;1&#x27;;
        timeStep.querySelector(&#x27;.cfc-step-circle&#x27;).textContent = stage === &#x27;schedule&#x27; ? &#x27;2&#x27; : &#x27;✓&#x27;;
        dataStep.querySelector(&#x27;.cfc-step-circle&#x27;).textContent = stage === &#x27;success&#x27; ? &#x27;✓&#x27; : &#x27;3&#x27;;
      }

      function setStage(stage) {
        schedulerPanel.hidden = stage !== &#x27;schedule&#x27;;
        contactPanel.hidden = stage !== &#x27;contact&#x27;;
        successPanel.hidden = stage !== &#x27;success&#x27;;
        updateProgress(stage);
      }

      function validateContact() {
        const complete = root.querySelector(&#x27;#cfc-name&#x27;).value.trim() &amp;&amp; root.querySelector(&#x27;#cfc-phone&#x27;).value.trim() &amp;&amp; root.querySelector(&#x27;#cfc-email&#x27;).value.trim();
        root.querySelector(&#x27;#cfc-confirm&#x27;).disabled = !complete;
      }

      prevButton.addEventListener(&#x27;click&#x27;, () =&gt; { viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, 1); selectedDate = null; selectedTime = null; renderCalendar(); renderTimes(); updateProgress(); });
      nextButton.addEventListener(&#x27;click&#x27;, () =&gt; { viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 1); selectedDate = null; selectedTime = null; renderCalendar(); renderTimes(); updateProgress(); });
      continueButton.addEventListener(&#x27;click&#x27;, () =&gt; { root.querySelector(&#x27;#cfc-summary-text&#x27;).textContent = selectionText(); setStage(&#x27;contact&#x27;); });
      root.querySelector(&#x27;#cfc-back&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; setStage(&#x27;schedule&#x27;));
      [&#x27;#cfc-name&#x27;, &#x27;#cfc-phone&#x27;, &#x27;#cfc-email&#x27;].forEach((selector) =&gt; root.querySelector(selector).addEventListener(&#x27;input&#x27;, validateContact));
      root.querySelector(&#x27;#cfc-confirm&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { root.querySelector(&#x27;#cfc-success-text&#x27;).textContent = `${selectionText()}. A confirmação foi enviada para seu e-mail e WhatsApp.`; setStage(&#x27;success&#x27;); });
      root.querySelector(&#x27;#cfc-again&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { selectedDate = null; selectedTime = null; renderCalendar(); renderTimes(); setStage(&#x27;schedule&#x27;); });

      renderCalendar();
      renderTimes();
      updateProgress();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
